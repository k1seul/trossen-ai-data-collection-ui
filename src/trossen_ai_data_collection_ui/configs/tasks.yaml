tasks:
  # episode_length_s is an UPPER BOUND, not the intended length. The operator ends the take with
  # Space the moment the object is placed; these values only have to leave room for a recovery
  # attempt when the first grasp or placement misses. The previous round set it to the intended
  # length and nobody ended early, so every episode ran the clock out and the last fifth of each
  # one was the arm sitting still -- 14.7% of all recorded frames.
  # ===========================================================================
  # Difficulty Tier 1 (easy): single object type, large forgiving container.
  # ===========================================================================
  - task_name: "pick_place_block_bowl"
    robot_model: "trossen_ai_solo"
    task_description: "Pick up the {object} and place it in the bowl."
    task_objects:
      - "red block"
      - "blue block"
      - "green block"
      - "yellow block"
    episode_length_s: 40
    warmup_time_s: 5
    reset_time_s: 15
    long_reset_interval: 10
    long_reset_time_s: 60
    hf_user: "k1seul"
    fps: 30
    display_fps: 30
    push_to_hub: true
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  # ===========================================================================
  # Difficulty Tier 2 (easy): same objects, different container (adds
  # container-shape/visual variety without adding grasp difficulty).
  # ===========================================================================
  - task_name: "pick_place_block_pot"
    robot_model: "trossen_ai_solo"
    task_description: "Pick up the {object} and place it in the pot."
    task_objects:
      - "red block"
      - "blue block"
      - "green block"
      - "yellow block"
    episode_length_s: 40
    warmup_time_s: 5
    reset_time_s: 15
    long_reset_interval: 10
    long_reset_time_s: 60
    hf_user: "k1seul"
    fps: 30
    display_fps: 30
    push_to_hub: true
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  # ===========================================================================
  # Difficulty Tier 3 (easy-medium): fruit props -- different shapes/sizes
  # than the wooden blocks, so grasp strategy has to adapt.
  # ===========================================================================
  - task_name: "pick_place_fruit_bowl"
    robot_model: "trossen_ai_solo"
    task_description: "Pick up the {object} and place it in the bowl."
    task_objects:
      - "orange"
      - "banana"
      - "apple"
      - "peach"
    episode_length_s: 45
    warmup_time_s: 5
    reset_time_s: 15
    long_reset_interval: 10
    long_reset_time_s: 60
    hf_user: "k1seul"
    fps: 30
    display_fps: 30
    push_to_hub: true
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  # ===========================================================================
  # Re-collection for the OOD experiment (see docs/ood_collection_protocol.md).
  #
  # Both containers are on the mat and the sentence names one, so "bowl" and "pot" have to be
  # read rather than inferred -- with a single container present the word carries nothing, the
  # way the colour did when only one block was out. It also varies the release: the pot's walls
  # are higher than the bowl's, so "over the container" cannot be one memorised pose.
  #
  # Distractor blocks, container zones and lighting come from scripts/staging_plan.py, which
  # the UI reads and shows per episode.
  # ===========================================================================
  - task_name: "block_to_named_container"
    robot_model: "trossen_ai_solo"
    task_description: "{object}"
    task_objects:
      - "Pick up the red block and place it in the bowl."
      - "Pick up the red block and place it in the pot."
      - "Pick up the blue block and place it in the bowl."
      - "Pick up the blue block and place it in the pot."
      - "Pick up the green block and place it in the bowl."
      - "Pick up the green block and place it in the pot."
      - "Pick up the yellow block and place it in the bowl."
      - "Pick up the yellow block and place it in the pot."
    episode_length_s: 45
    warmup_time_s: 5
    reset_time_s: 20
    long_reset_interval: 10
    long_reset_time_s: 60
    hf_user: "k1seul"
    fps: 30
    display_fps: 30
    push_to_hub: true
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  # ===========================================================================
  # Difficulty Tier 4 (medium): stacking colored tape rolls -- precise
  # alignment plus a gentle, controlled release so the stack doesn't topple.
  # Both the picked and base tape colors are named explicitly in each
  # instruction (not "the other one"). 5 tape colors on hand (red, blue,
  # green, purple, yellow); rather than all 20 possible ordered pairs, this
  # covers just a minimal rotating cycle where every color appears once as
  # the picked tape and once as the base.
  # ===========================================================================
  - task_name: "stack_tapes"
    robot_model: "trossen_ai_solo"
    task_description: "{object}"
    task_objects:
      - "Pick up the red tape and stack it on top of the blue tape."
      - "Pick up the blue tape and stack it on top of the green tape."
      - "Pick up the green tape and stack it on top of the purple tape."
      - "Pick up the purple tape and stack it on top of the yellow tape."
      - "Pick up the yellow tape and stack it on top of the red tape."
    episode_length_s: 45
    warmup_time_s: 5
    reset_time_s: 15
    long_reset_interval: 10
    long_reset_time_s: 60
    hf_user: "k1seul"
    fps: 30
    display_fps: 30
    push_to_hub: true
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  # ===========================================================================
  # Difficulty Tier 5 (medium-hard): sequential/compound task -- pick two
  # objects in order within a single episode. This was your own earlier idea
  # (previously named pick_up_the_red_than_blue_block); it's restored here as
  # a proper multi-variant task so multiple color pairs share one repo.
  # ===========================================================================
  - task_name: "sequential_two_blocks_bowl"
    robot_model: "trossen_ai_solo"
    task_description: "{object}"
    task_objects:
      - "Pick up the red block and place it in the bowl, then pick up the blue block and place it in the bowl."
      - "Pick up the blue block and place it in the bowl, then pick up the green block and place it in the bowl."
      - "Pick up the green block and place it in the bowl, then pick up the yellow block and place it in the bowl."
      - "Pick up the yellow block and place it in the bowl, then pick up the red block and place it in the bowl."
    episode_length_s: 75
    warmup_time_s: 10
    reset_time_s: 20
    long_reset_interval: 10
    long_reset_time_s: 60
    hf_user: "k1seul"
    fps: 30
    display_fps: 30
    push_to_hub: true
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  # ===========================================================================
  # Difficulty Tier 6 (hard): clutter/discrimination -- ALL blocks and fruits
  # are on the mat at once (see protocol doc for scene setup); the robot must
  # pick only the one named in the instruction and ignore the rest.
  # ===========================================================================
  - task_name: "pick_specific_item_from_clutter"
    robot_model: "trossen_ai_solo"
    task_description: "Pick up the {object} and place it in the bowl. Do not touch the other items."
    # Blocks AND tape rolls, and no fruit. Measured off the demonstrations, with the gripper
    # position read as half the jaw gap: the jaws open 69.6 mm and an apple is 69.4, so a round
    # fruit is not a tolerance the policy can miss -- the jaws cannot close around it even when
    # aimed perfectly. A 25 mm block leaves 22 mm a side and a tape roll gripped across its
    # outer diameter leaves 13, both comfortably past the policy's 7-12 mm of error.
    #
    # The two props also differ where it matters for this round. A block spans 27 px of the
    # frame and covers about one 14 px patch inside the crop; a tape roll spans 46 px and
    # covers nearly three, so it is the tape that gives the forecast loss something to see.
    # Mixing them is what finally puts a real size and shape axis in the data, which 552
    # episodes of effectively four object sizes did not have.
    task_objects:
      - "red block"
      - "blue block"
      - "green block"
      - "yellow block"
      - "red tape roll"
      - "blue tape roll"
      - "green tape roll"
      - "yellow tape roll"
    episode_length_s: 45
    warmup_time_s: 10
    reset_time_s: 25
    long_reset_interval: 10
    long_reset_time_s: 60
    hf_user: "k1seul"
    fps: 30
    display_fps: 30
    push_to_hub: true
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  # ===========================================================================
  # Difficulty Tier 7 (hardest, single-arm): spatial precision using zones
  # marked on the whiteboard sheet over the cutting mat (see protocol doc for
  # how to mark zones A/B/C). Tests precise placement at an exact location
  # rather than "anywhere in a container".
  # ===========================================================================
  - task_name: "place_object_in_marked_zone"
    robot_model: "trossen_ai_solo"
    task_description: "{object}"
    task_objects:
      - "Pick up the red block and place it in zone A."
      - "Pick up the blue block and place it in zone B."
      - "Pick up the green block and place it in zone C."
      - "Pick up the orange and place it in zone A."
      - "Pick up the banana and place it in zone B."
    episode_length_s: 45
    warmup_time_s: 10
    reset_time_s: 15
    long_reset_interval: 10
    long_reset_time_s: 60
    hf_user: "k1seul"
    fps: 30
    display_fps: 30
    push_to_hub: true
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1
