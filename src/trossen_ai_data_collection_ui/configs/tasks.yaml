tasks:
  # ONE block per task. To add another: copy this block, change task_name -- which is also the
  # HuggingFace dataset the episodes are written to -- change task_description, and list its
  # task_objects. Everything else follows from those three.
  #
  #   task_objects   what the instruction can name, one per episode
  #   props          what is physically on the bench. scripts/staging_plan.py draws distractors
  #                  from this, so a sheet can only ask for objects that exist; asking for one
  #                  that does not is how an apple ended up standing in for "red".
  #
  # {object} in task_description is filled per episode from the staging sheet's target, and the
  # setup gate points the object combobox at it. A sheet generated for a DIFFERENT task is
  # refused there rather than substituted into the sentence, which once produced "Pick up the
  # Pick up the blue block and place it in the pot. and place it in the bowl."
  #
  #   python scripts/staging_plan.py --task <task_name> --episodes 2 --distractors 3 \
  #       --csv ~/.trossen/trossen_ai_data_collection/plan/staging_sheet.csv
  #
  # episode_length_s is an UPPER BOUND, not the intended length: the operator ends the take with
  # Space the moment the object is placed, and these values only have to leave room for a
  # recovery attempt. The previous round set it to the intended length and nobody ended early,
  # so every episode ran the clock out and the last fifth of each was the arm sitting still --
  # 14.7% of all recorded frames.

# SIX objects, and the two left out are the point rather than the leftovers.
#
# Every colour and every kind below appears in training -- yellow as a tape roll, green as a
# block -- so the held-out pair is not two objects the policy has never seen. It is two
# COMBINATIONS it has never seen, made of parts it knows well. "Pick up the yellow block" asks
# it to put together a colour it has read and a shape it has grasped, a sharper question than
# whether it copes with an unfamiliar object, and one this bench asks for nothing.
#
# Keep the held-out two OFF THE MAT while recording. As distractors they would be seen but
# never named, which measures something else and blurs the claim.

- task_name: pick_specific_item_from_clutter
  robot_model: trossen_ai_solo
  task_description: Pick up the {object} and place it in the bowl. Do not touch the other items.
  task_objects: &id001
  - red block
  - blue block
  - green block
  - red tape roll
  - blue tape roll
  - yellow tape roll
  props: *id001
  held_out_objects:
  - yellow block
  - green tape roll
  episode_length_s: 45
  warmup_time_s: 10
  reset_time_s: 25
  long_reset_interval: 10
  long_reset_time_s: 60
  hf_user: k1seul
  fps: 30
  display_fps: 30
  push_to_hub: true
  play_sounds: true
  disable_active_ui_updates: false
  save_interval: 1
