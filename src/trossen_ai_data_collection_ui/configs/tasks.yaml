tasks:
  - task_name: "trossen_ai_solo_dummy"
    robot_model: "trossen_ai_solo"
    task_description: "A dummy task for the Trossen AI Solo robot."
    episode_length_s: 10
    warmup_time_s: 5
    reset_time_s: 5
    hf_user: "YourUser"
    fps: 30
    display_fps: 1
    push_to_hub: false
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  - task_name: "trossen_ai_mobile_dummy"
    robot_model: "trossen_ai_mobile"
    task_description: "A dummy task for the Trossen AI Mobile robot."
    episode_length_s: 10
    warmup_time_s: 5
    reset_time_s: 5
    hf_user: "YourUser"
    fps: 30
    display_fps: 1
    push_to_hub: false
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  - task_name: "trossen_ai_stationary_dummy"
    robot_model: "trossen_ai_stationary"
    task_description: "A dummy task for the Trossen AI Stationary robot."
    episode_length_s: 10
    warmup_time_s: 5
    reset_time_s: 5
    hf_user: "YourUser"
    fps: 30
    display_fps: 1
    push_to_hub: false
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1

  # Example multi-task/multi-object entry. All episodes recorded under this
  # task_name go into the SAME Hugging Face dataset repo (hf_user/task_name),
  # but `task_description` uses an {object} placeholder that gets filled in
  # from the "OBJECT / VARIANT" field in the UI at the start of each episode
  # (editable between episodes without stopping the session). `task_objects`
  # is just the dropdown preset list; you can also type any custom value in
  # that field, it doesn't need to be listed here.
  - task_name: "trossen_ai_stationary_pick_and_place"
    robot_model: "trossen_ai_stationary"
    task_description: "Pick up the {object} and place it in the bin."
    task_objects:
      - "red block"
      - "blue block"
      - "green cup"
    episode_length_s: 10
    warmup_time_s: 5
    reset_time_s: 5
    hf_user: "YourUser"
    fps: 30
    display_fps: 1
    push_to_hub: false
    play_sounds: true
    disable_active_ui_updates: false
    save_interval: 1
