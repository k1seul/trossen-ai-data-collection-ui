# NOT the file the running application reads.
#
# The UI loads ~/.trossen/trossen_ai_data_collection/configs/tasks.yaml -- a persistent copy it
# seeds from this one on first run and never refreshes. Editing this file alone changes nothing,
# and the symptom is specific and misleading: the setup gate reports "This staging sheet is for
# a different task", because the sheet names an object the stale copy has never heard of.
#
# After changing anything here:
#     cp src/trossen_ai_data_collection_ui/configs/tasks.yaml \
#        ~/.trossen/trossen_ai_data_collection/configs/tasks.yaml
#
tasks:
  # ONE block per task. To add another: copy this block, change task_name -- which is also the
  # HuggingFace dataset the episodes are written to -- change task_description, and list its
  # task_objects. Everything else follows from those three.
  #
  #   task_objects   what the instruction can name, one per episode
  #   props          what is physically on the bench. scripts/staging_plan.py draws distractors
  #                  from this, so a sheet can only ask for objects that exist; asking for one
  #                  that does not is how an apple ended up standing in for "red".
  #
  # {object} in task_description is filled per episode from the staging sheet's target, and the
  # setup gate points the object combobox at it. A sheet generated for a DIFFERENT task is
  # refused there rather than substituted into the sentence, which once produced "Pick up the
  # Pick up the blue block and place it in the pot. and place it in the bowl."
  #
  #   python scripts/staging_plan.py --task <task_name> --episodes 2 --distractors 3 \
  #       --csv ~/.trossen/trossen_ai_data_collection/plan/staging_sheet.csv
  #
  # episode_length_s is an UPPER BOUND, not the intended length: the operator ends the take with
  # Space the moment the object is placed, and these values only have to leave room for a
  # recovery attempt. The previous round set it to the intended length and nobody ended early,
  # so every episode ran the clock out and the last fifth of each was the arm sitting still --
  # 14.7% of all recorded frames.

# SIX objects, and the two left out are the point rather than the leftovers.
#
# Every colour and every kind below appears in training -- yellow as a tape roll, green as a
# block -- so the held-out pair is not two objects the policy has never seen. It is two
# COMBINATIONS it has never seen, made of parts it knows well. "Pick up the yellow block" asks
# it to put together a colour it has read and a shape it has grasped, a sharper question than
# whether it copes with an unfamiliar object, and one this bench asks for nothing.
#
# Keep the held-out two OFF THE MAT while recording. As distractors they would be seen but
# never named, which measures something else and blurs the claim.

- task_name: pick_specific_item_from_clutter
  robot_model: trossen_ai_solo
  task_description: Pick up the {object} and place it in the bowl. Do not touch the other items.
  task_objects: &trained
  - red block
  - blue block
  - green block
  - red tape roll
  - blue tape roll
  - yellow tape roll
  - cucumber
  - banana
  - white radish
  - corn
  - green pepper
  props: *trained
  # THREE held out, testing two different things.
  #
  #   yellow block, green tape roll   COMPOSITIONAL. Every colour and every kind below appears
  #                                   in training -- yellow as a tape roll, green as a block --
  #                                   so these are combinations the policy has never been asked
  #                                   for, made of parts it knows well.
  #   strawberry                      NOVEL. Not a recombination: an object that was never in
  #                                   the training set at all. Chosen over the watermelon slice
  #                                   and the orange because it is compact and grips like the
  #                                   trained props -- an orange rolls and a wedge depends on
  #                                   which way up it lands, and a failure there would be about
  #                                   the shape rather than about novelty.
  #
  # Keep all three OFF THE MAT while recording. As distractors they would be seen but never
  # named, which measures something else -- and the last round let that happen in five
  # episodes.
  held_out_objects:
  - yellow block
  - green tape roll
  - strawberry
  episode_length_s: 45
  warmup_time_s: 10
  reset_time_s: 25
  long_reset_interval: 10
  long_reset_time_s: 60
  hf_user: k1seul
  fps: 30
  display_fps: 30
  push_to_hub: true
  play_sounds: true
  disable_active_ui_updates: false
  save_interval: 1

# TWO objects, in order. The single-object task is one reach; this is a reach, a release, and a
# second reach that has to start from wherever the first one ended. Nothing in the current
# dataset requires the policy to carry state across a placement, and a forecast objective is
# exactly the kind of thing that ought to help there -- which makes it worth having before
# claiming the forecast does or does not help.
#
# {object} and {object2} are filled per episode from the staging sheet. episode_length_s is
# doubled, because it is two of the first task end to end.
- task_name: pick_two_in_order
  robot_model: trossen_ai_solo
  task_description: Pick up the {object} and place it in the bowl, then pick up the {object2}
    and place it in the bowl.
  task_objects: *trained
  props: *trained
  held_out_objects:
  - yellow block
  - green tape roll
  - strawberry
  episode_length_s: 90
  warmup_time_s: 10
  reset_time_s: 30
  long_reset_interval: 10
  long_reset_time_s: 60
  hf_user: k1seul
  fps: 30
  display_fps: 30
  push_to_hub: true
  play_sounds: true
  disable_active_ui_updates: false
  save_interval: 1
