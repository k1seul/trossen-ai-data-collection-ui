[project]
name = "trossen-ai-data-collection-ui"
version = "1.2.2"
description = "Trossen AI Data Collection UI - customized fork for local project use"
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "BSD-3-Clause" }
dependencies = [
    "pyside6==6.8.0",
    "opencv-python==4.12.0.88",
    "numpy==2.2.6",
    "pyyaml>=6.0",
    "termcolor>=2.0",
    "trossen-arm==1.9.3",
    "trossen-slate==0.0.3",
    "pyrealsense2==2.58.2.10647",
    "av==12.3.0",
    "lerobot[trossen_ai]",
]

[project.scripts]
trossen_ai_data_collection_ui = "trossen_ai_data_collection_ui.__main__:main"
trossen_ai_data_collection_ui_post_install = "trossen_ai_data_collection_ui.post_install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trossen_ai_data_collection_ui"]

[tool.uv.sources]
# Pinned to the exact commit your working `trossen_ai_data_collection_ui_env`
# conda env was built against, so driver/firmware-sensitive packages (like
# trossen-arm) stay in lockstep with what your arms' firmware expects.
# To move to the latest upstream commit later: change `rev` to `branch = "trossen-ai"`.
lerobot = { git = "https://github.com/Interbotix/lerobot.git", rev = "3f1a655" }
